name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main, interface/workspace-v0.2]
  pull_request:
    paths:
      - 'columns_ec2/**'
      - 'tools/**'
      - 'ColumnsEC2.spec'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-optional.txt pyinstaller "pandas>=2.0,<3.0"
      - name: Check source runtime
        run: python tools/smoke_test.py
      - name: Check Excel export fidelity and atomicity
        run: python tools/excel_smoke_test.py
      - name: Check desktop workflow
        run: python tools/gui_smoke_test.py
      - name: Build portable application
        run: python -m PyInstaller --clean --noconfirm ColumnsEC2.spec
      - name: Check packaged application
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP 'columns-self-test.json'
          $process = Start-Process -FilePath 'dist/ColumnsEC2/ColumnsEC2.exe' -ArgumentList @('--self-test', $receipt) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged check timed out' }
          if ($process.ExitCode -ne 0) { if (Test-Path $receipt) { Get-Content $receipt }; throw 'Packaged check failed' }
          if (-not (Test-Path $receipt)) { throw 'Missing packaged check receipt' }
          $result = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok') { throw 'Invalid packaged check receipt' }
      - name: Add distribution documents
        shell: pwsh
        run: Copy-Item LICENSE, README.md dist/ColumnsEC2/
      - uses: actions/upload-artifact@v4
        with:
          name: ColumnsEC2-Windows-x64-portable
          path: dist/ColumnsEC2/
          if-no-files-found: error
      - name: Publish versioned Windows distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $archive = "ColumnsEC2-v$version-Windows-x64.zip"
          Compress-Archive -Path dist/ColumnsEC2/* -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $archive" | Set-Content "$archive.sha256"
          gh release create "v$version" $archive "$archive.sha256" --target ${{ github.sha }} --title "ColumnsEC2 v$version — Windows x64" --notes-file "docs/releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
